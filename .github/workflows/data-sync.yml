# ══════════════════════════════════════════════════════════════════════════════
# 🔄 Data sync — grants + cultural agents (split out of the deploy pipeline)
#
# Visual DAG (each job = one node in the GitHub graph):
#
#   ┌─ sync-grants ──┐
#   └─ sync-culture ─┴─► sync-supabase-push ─► commit-cultural-data ─► summary
#
# What lands where:
#   • grants export → Supabase only (scripts/output/grants_export_* is
#     gitignored; the client reads grants live from Supabase).
#   • cultural agents → Supabase AND committed back to
#     public/data/cultural-agents/*.json, because the site serves those
#     files statically (see composables/useCulturalAgentsData.ts). The
#     commit retriggers the deploy pipeline, which rebuilds with fresh data.
#
# Loop guard: the push trigger ignores public/data/cultural-agents/**, so
# the commit-back push (which touches ONLY those files) never retriggers
# this workflow.
#
# Triggers: pushes to master/develop, every 2 hours, manual dispatch.
# ══════════════════════════════════════════════════════════════════════════════
name: 🔄 Data sync · grants + cultural agents

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - 'public/data/cultural-agents/**'
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours — refresh grants radar

permissions:
  contents: write # commit-back of refreshed cultural-agents data

concurrency:
  group: data-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.0'
  PYTHON_VERSION: '3.12'
  # Shared pip set (repo has no requirements.txt; keep in ONE place).
  PIP_DEPS: 'feedparser aiohttp aiofiles beautifulsoup4 lxml python-dateutil rich click'

# ════════════════════════════════════════════════════════════════════════════
# JOBS
# ════════════════════════════════════════════════════════════════════════════
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1️⃣ Scrape sub-nodes (run concurrently) ─► Supabase push
  # ─────────────────────────────────────────────────────────────────────────
  sync-grants:
    name: '🌱 Sync · grants scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      export-file: ${{ steps.capture.outputs.export-file }}
      accepted: ${{ steps.capture.outputs.accepted }}
      open: ${{ steps.capture.outputs.open }}
      expired: ${{ steps.capture.outputs.expired }}
      closed: ${{ steps.capture.outputs.closed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐍 Restore pip cache (incremental)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          # Rebuild only when the scraper sources change.
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('scripts/grants.py', 'scripts/grants_gates_test.py') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: 🐍 Install Python dependencies
        run: pip install $PIP_DEPS

      - name: 🌱 Scrape grants (standing excluded; closed + past-deadline dropped)
        run: python scripts/grants.py -o grants_export

      - id: capture
        name: ✅ Analyze + validate grants output
        run: |
          # NOTE: `|| true` — the default GH Actions shell runs with
          # `-e -o pipefail`, so a bare `ls` with no glob match (exit 2)
          # would kill this step before the analyzer's graceful
          # `__missing__` branch (exit 0) is reached.
          EXPORT_FILE=$(ls -t scripts/output/grants_export_*.json 2>/dev/null | head -1 || true)
          {
            echo "export-file=$EXPORT_FILE"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$EXPORT_FILE" ]; then
            echo "::error::Grants scraper completed without producing scripts/output/grants_export_*.json"
            exit 1
          fi
          # Analyzer appends counts to GITHUB_OUTPUT and exits nonzero when a gate fails.
          python3 scripts/analyze_grants_export.py "$EXPORT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload grants export artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: grants-export
          path: scripts/output/grants_export_*.*
          retention-days: 14
          if-no-files-found: warn

      - name: 📤 Upload dead-grants sidecar (funder-page-closed)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: grants-dead-sidecar
          path: scripts/output/dead_*.*
          retention-days: 14
          if-no-files-found: ignore

  sync-culture:
    name: '🎭 Sync · cultural agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      export-file: ${{ steps.capture.outputs.export-file }}
      total: ${{ steps.capture.outputs.total }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🐍 Restore pip cache (incremental)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('scripts/sync-cultural-agents.py') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: 🐍 Install Python dependencies
        run: pip install $PIP_DEPS

      - name: 🎭 Sync cultural agents (Mapa Cultura + Floresta Ativista)
        run: python scripts/sync-cultural-agents.py

      - id: capture
        name: ✅ Validate cultural agents output
        run: |
          # NOTE: `|| true` — see sync-grants capture (pipefail + empty glob).
          EXPORT_FILE=$(ls -t scripts/output/cultural_agents_export_*.json 2>/dev/null | head -1 || true)
          if [ -z "$EXPORT_FILE" ]; then
            echo "export-file=" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "::error::Cultural agents scraper completed without producing scripts/output/cultural_agents_export_*.json"
            exit 1
          fi
          echo "export-file=$EXPORT_FILE" >> "$GITHUB_OUTPUT"
          STATS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); agents=d.get('agents',[]); mapa=len([a for a in agents if a.get('source')=='mapa_cultura']); fa=len([a for a in agents if a.get('source')=='floresta_ativista']); print(f'Total: {len(agents)}, Mapa Cultura: {mapa}, Floresta Ativista: {fa}')" "$EXPORT_FILE")
          echo "Cultural agents stats: $STATS"
          TOTAL=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('agents',[])))" "$EXPORT_FILE")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          {
            echo "## 🎭 Cultural agents sync — ${EXPORT_FILE##*/}"
            echo ""
            echo "- Stats: **${STATS}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload cultural agents data (for commit-back job)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cultural-agents-data
          path: public/data/cultural-agents/
          retention-days: 7
          if-no-files-found: warn

      - name: 📤 Upload cultural agents export
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cultural-agents-export
          path: scripts/output/cultural_agents_export_*.*
          retention-days: 14
          if-no-files-found: warn

  sync-supabase-push:
    name: '☁️ Sync · Supabase push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sync-grants, sync-culture]
    outputs:
      grants-push: ${{ steps.push-grants.outcome }}
      dead-push: ${{ steps.push-dead.outcome }}
      agents-push: ${{ steps.push-agents.outcome }}
    # Run even if one scrape failed so the surviving dataset still syncs;
    # skip only when BOTH scrapes failed.
    if: always() && (needs.sync-grants.result == 'success' || needs.sync-culture.result == 'success')
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm # ✅ incremental

      - name: 📦 Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 📥 Download grants export
        if: needs.sync-grants.result == 'success'
        id: download-grants
        uses: actions/download-artifact@v7
        with:
          name: grants-export
          path: scripts/output/
        continue-on-error: true

      - name: 📥 Download cultural agents export
        if: needs.sync-culture.result == 'success'
        id: download-agents
        uses: actions/download-artifact@v7
        with:
          name: cultural-agents-export
          path: scripts/output/
        continue-on-error: true

      - name: 📥 Download dead-grants sidecar
        uses: actions/download-artifact@v7
        with:
          name: grants-dead-sidecar
          path: scripts/output/
        continue-on-error: true

      - name: ☁️ Push grants to Supabase
        id: push-grants
        continue-on-error: true
        run: |
          # NOTE: `|| true` — see sync-grants capture (pipefail + empty glob).
          EXPORT_FILE=$(ls -t scripts/output/grants_export_*.json 2>/dev/null | head -1 || true)
          if [ "$SYNC_GRANTS_RESULT" != "success" ]; then
            echo "Skipping grants push because the scrape/validation job failed."
            exit 0
          fi
          if [ -z "$EXPORT_FILE" ]; then
            echo "::error::Grants scrape succeeded but its export artifact is missing."
            exit 1
          fi
          # Temporal-gate defense in depth: the analyzer already failed the
          # sync-grants job on expired/closed leaks — never push that export
          # to Supabase (sync script double-guards, but skip early + loudly).
          if [ "$GRANTS_EXPIRED" != "0" ] || [ "$GRANTS_CLOSED" != "0" ]; then
            echo "::error::Grants temporal gate leaked (expired=$GRANTS_EXPIRED, closed=$GRANTS_CLOSED); refusing to push this export."
            exit 1
          fi
          npx tsx scripts/sync-grants-to-supabase.ts grants "$EXPORT_FILE"
        env:
          SYNC_GRANTS_RESULT: ${{ needs.sync-grants.result }}
          GRANTS_EXPIRED: ${{ needs.sync-grants.outputs.expired }}
          GRANTS_CLOSED: ${{ needs.sync-grants.outputs.closed }}
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: ☁️ Flip funder-page-closed rows
        id: push-dead
        continue-on-error: true
        run: |
          if [ "$SYNC_GRANTS_RESULT" != "success" ]; then
            echo "Skipping dead-grants update because the grants scrape/validation job failed."
            exit 0
          fi
          DEAD_FILE=$(ls -t scripts/output/dead_*.* 2>/dev/null | head -1 || true)
          if [ -z "$DEAD_FILE" ]; then
            echo "No dead-grants sidecar, skipping mark-dead"
            exit 0
          fi
          npx tsx scripts/sync-grants-to-supabase.ts mark-dead "$DEAD_FILE"
        env:
          SYNC_GRANTS_RESULT: ${{ needs.sync-grants.result }}
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: ☁️ Push cultural agents to Supabase
        id: push-agents
        continue-on-error: true
        run: |
          # NOTE: `|| true` — see sync-grants capture (pipefail + empty glob).
          EXPORT_FILE=$(ls -t scripts/output/cultural_agents_export_*.json 2>/dev/null | head -1 || true)
          if [ "$SYNC_CULTURE_RESULT" != "success" ]; then
            echo "Skipping cultural agents push because the scrape/validation job failed."
            exit 0
          fi
          if [ -z "$EXPORT_FILE" ]; then
            echo "::error::Cultural agents scrape succeeded but its export artifact is missing."
            exit 1
          fi
          npx tsx scripts/sync-grants-to-supabase.ts agents "$EXPORT_FILE"
        env:
          SYNC_CULTURE_RESULT: ${{ needs.sync-culture.result }}
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 📝 Summary
        if: always()
        env:
          GRANTS_RESULT: ${{ needs.sync-grants.result }}
          CULTURE_RESULT: ${{ needs.sync-culture.result }}
          PUSH_RESULT: ${{ job.status }}
          GRANTS_PUSH: ${{ steps.push-grants.outcome }}
          DEAD_PUSH: ${{ steps.push-dead.outcome }}
          AGENTS_PUSH: ${{ steps.push-agents.outcome }}
        run: |
          {
            echo "## ☁️ Supabase push"
            echo ""
            echo "| Dataset | Scrape result | Push outcome |"
            echo "|---|---|---|"
            echo "| grants | \`$GRANTS_RESULT\` | \`$GRANTS_PUSH\` (dead sidecar: \`$DEAD_PUSH\`) |"
            echo "| cultural agents | \`$CULTURE_RESULT\` | \`$AGENTS_PUSH\` |"
            echo ""
            echo "_Push steps run independently; any failed scrape, validation, artifact download, or database write fails this workflow._"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GRANTS_RESULT" != "success" ] || [ "$CULTURE_RESULT" != "success" ] || \
             [ "$GRANTS_PUSH" = "failure" ] || [ "$DEAD_PUSH" = "failure" ] || \
             [ "$AGENTS_PUSH" = "failure" ] || [ "$PUSH_RESULT" = "failure" ]; then
            echo "::error::At least one data-sync scrape, validation, artifact, or Supabase push step failed."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # 2️⃣ Commit refreshed static data back so the deploy pipeline
  #    (separate workflow run) picks it up via checkout.
  # ─────────────────────────────────────────────────────────────────────────
  commit-cultural-data:
    name: '💾 Commit · refreshed cultural agents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sync-culture]
    if: needs.sync-culture.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: 📥 Download refreshed cultural agents data
        uses: actions/download-artifact@v7
        with:
          name: cultural-agents-data
          path: public/data/cultural-agents/

      - name: 💾 Commit + push (bot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cultural-agents/
          if git diff --cached --quiet; then
            echo "Cultural agents data unchanged — nothing to commit."
            echo "COMMIT_OUTCOME=unchanged" >> "$GITHUB_ENV"
          else
            git commit -m "chore(data): refresh cultural agents" -m "Via Data sync workflow (scripts/sync-cultural-agents.py). Triggers a deploy rebuild with fresh static data."
            git push
            echo "COMMIT_OUTCOME=pushed" >> "$GITHUB_ENV"
          fi

      - name: 📝 Summary
        if: always()
        run: |
          {
            echo "## 💾 Cultural agents commit-back"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- Outcome: **${COMMIT_OUTCOME:-unknown}**"
            echo "  (\`unchanged\` = scrape matched repo · \`pushed\` = fresh data committed, deploy rebuild triggered)"
            echo "- Loop guard: this workflow's push trigger ignores \`public/data/cultural-agents/**\`, so the bot push never retriggers a sync."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # 3️⃣ Terminal aggregator — sync overview (always runs)
  # ─────────────────────────────────────────────────────────────────────────
  sync-summary:
    name: '📊 Sync summary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - sync-grants
      - sync-culture
      - sync-supabase-push
      - commit-cultural-data
    if: always()
    steps:
      - name: 📊 Aggregate results
        run: |
          {
            echo "# 📊 Data sync overview"
            echo ""
            echo "_ref \`${{ github.ref }}\` · sha \`${{ github.sha }}\` · event \`${{ github.event_name }}\`_"
            echo ""
            echo "| Node | Result | Output |"
            echo "|---|---|---|"
            echo "| 🌱 Grants scrape | \`${{ needs.sync-grants.result }}\` | accepted: \`${{ needs.sync-grants.outputs.accepted }}\` · open: \`${{ needs.sync-grants.outputs.open }}\` · expired: \`${{ needs.sync-grants.outputs.expired }}\` · closed: \`${{ needs.sync-grants.outputs.closed }}\` |"
            echo "| 🎭 Cultural agents | \`${{ needs.sync-culture.result }}\` | total: \`${{ needs.sync-culture.outputs.total }}\` |"
            echo "| ☁️ Supabase push | \`${{ needs.sync-supabase-push.result }}\` | grants + agents |"
            echo "| 💾 Commit-back | \`${{ needs.commit-cultural-data.result }}\` | static data → repo (deploy rebuilds) |"
          } >> "$GITHUB_STEP_SUMMARY"

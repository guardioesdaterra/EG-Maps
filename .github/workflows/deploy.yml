name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours — refresh grants radar

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    needs: [sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download cultural agents data
        uses: actions/download-artifact@v5
        with:
          name: cultural-agents-data
          path: public/data/cultural-agents/
        continue-on-error: true

      - name: Prepare Nuxt types
        run: npx nuxi prepare

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build species icon mapping (Game Icons SSG)
        run: node scripts/build-species-icon-mapping.mjs

      - name: Compute overlap indicators (P1.7)
        run: node scripts/compute-overlaps.mjs

      - name: Verify secrets
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:0:30}..."
          echo "SUPABASE_KEY length=${#SUPABASE_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}

      - name: Build static site
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /EG-Maps/
          NUXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NUXT_PUBLIC_MAPTILER_API_KEY }}
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}

      - name: Copy 200.html as 404.html for SPA fallback
        run: |
          if [ -f .output/public/200.html ]; then
            cp .output/public/200.html .output/public/404.html
          elif [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          else
            echo "Warning: No 200.html or index.html found for 404 fallback"
          fi

      - name: Verify .nojekyll present
        run: |
          if [ ! -f .output/public/.nojekyll ]; then
            echo "::error::.nojekyll missing from build output — _payload.json would be hidden by Jekyll"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  playwright:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E tests
        run: npx playwright test --config=playwright.config.ts tests/map-rendering.spec.ts
        env:
          CI: true
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          NUXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NUXT_PUBLIC_MAPTILER_API_KEY }}

  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      # ── Shared setup ──────────────────────────────────────────
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install feedparser aiohttp aiofiles beautifulsoup4 lxml python-dateutil rich click

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── Sub-step 1: Grants sync ───────────────────────────────
      - name: Scrape grants (standing entries excluded by default)
        run: python scripts/grants.py -o grants_export
        continue-on-error: true

      - name: Validate grants output
        run: |
          EXPORT_FILE=$(ls -t scripts/output/grants_export_*.json 2>/dev/null | head -1)
          if [ -z "$EXPORT_FILE" ]; then
            echo "No grants export file found"
            exit 0
          fi
          REAL_GRANTS=$(python3 -c "import json; d=json.load(open('${EXPORT_FILE}')); grants=d.get('grants',d) if isinstance(d,dict) else d; non_standing=[g for g in grants if not g.get('is_standing',False)]; real_with_data=[g for g in non_standing if g.get('deadline') or g.get('amount_max') or g.get('description','').strip()]; print(f'Total: {len(grants)}, Non-standing: {len(non_standing)}, With deadline/amount: {len(real_with_data)}')")
          echo "Grants stats: $REAL_GRANTS"
          python3 -c "import json; d=json.load(open('${EXPORT_FILE}')); grants=d.get('grants',d) if isinstance(d,dict) else d; [print(f'  [{g.get(\"priority_score\",0):3d}] {g.get(\"source\",\"\"):25s} | {g.get(\"title\",\"\")[:60]}') for g in sorted(grants, key=lambda x: x.get('priority_score',0), reverse=True)[:5]]"

      # ── Sub-step 2: Cultural agents sync ──────────────────────
      - name: Sync cultural agents (Mapa Cultura + Floresta Ativista)
        run: python scripts/sync-cultural-agents.py
        continue-on-error: true

      - name: Validate cultural agents output
        run: |
          EXPORT_FILE=$(ls -t scripts/output/cultural_agents_export_*.json 2>/dev/null | head -1)
          if [ -z "$EXPORT_FILE" ]; then
            echo "No cultural agents export file found"
            exit 0
          fi
          STATS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); agents=d.get('agents',[]); mapa=len([a for a in agents if a.get('source')=='mapa_cultura']); fa=len([a for a in agents if a.get('source')=='floresta_ativista']); print(f'Total: {len(agents)}, Mapa Cultura: {mapa}, Floresta Ativista: {fa}')" "$EXPORT_FILE")
          echo "Cultural agents stats: $STATS"

      # ── Shared step: Supabase push ────────────────────────────
      - name: Push migrations to Supabase
        run: npx supabase db push --project-ref lfyvociptzyhjtrxwhhf
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Sync grants to Supabase
        continue-on-error: true
        run: |
          EXPORT_FILE=$(ls -t scripts/output/grants_export_*.json 2>/dev/null | head -1)
          if [ -n "$EXPORT_FILE" ]; then
            npx tsx scripts/sync-grants-to-supabase.ts "$EXPORT_FILE"
          else
            echo "No grants export file found, skipping sync"
          fi
        env:
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sync cultural agents to Supabase
        continue-on-error: true
        run: |
          EXPORT_FILE=$(ls -t scripts/output/cultural_agents_export_*.json 2>/dev/null | head -1)
          if [ -n "$EXPORT_FILE" ]; then
            npx tsx scripts/sync-cultural-agents-to-supabase.ts "$EXPORT_FILE"
          else
            echo "No cultural agents export file found, skipping sync"
          fi
        env:
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Review Supabase databases
        run: npx supabase inspect db --project-ref lfyvociptzyhjtrxwhhf
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── Artifact upload (for build job) ───────────────────────
      - name: Upload cultural agents artifact
        uses: actions/upload-artifact@v5
        with:
          name: cultural-agents-data
          path: public/data/cultural-agents/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

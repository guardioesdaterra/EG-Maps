# ══════════════════════════════════════════════════════════════════════════════
# 🕛 Grants expiry sweep — daily at 00:00 UTC
#
# Flips status=open rows in public.grants whose deadline (YYYY-MM-DD) is
# before today to status=expired, so closed calls stop showing stale
# "remaining days" in the portal. Dateless rows are rolling calls and are
# never touched; unparseable deadlines are reported, never flipped.
# ══════════════════════════════════════════════════════════════════════════════
name: 🕛 Grants expiry sweep

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: grants-close-expired
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.0'

jobs:
  close-expired:
    name: '🕛 Close expired grants'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📦 Install Node dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🕛 Expire past-deadline grants
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/sync-grants-to-supabase.ts close-expired --dry-run
          else
            npx tsx scripts/sync-grants-to-supabase.ts close-expired
          fi
        env:
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 📝 Summary
        if: always()
        run: |
          echo "## 🕛 Grants expiry sweep" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Conclusion: \`${{ job.status }}\` (see logs for scanned/expired counts)" >> "$GITHUB_STEP_SUMMARY"

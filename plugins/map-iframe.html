<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .crew-map-section {
    position: relative;
    padding-left: 7%;

    width: 90vw;
    max-width: 90vw;
    max-height: 90vh;
    margin-left: calc(-50vw + 50%);
    height: 90vh;
    line-height: 0;
    overflow: hidden;
    transition: width 0.4s ease, height 0.4s ease;
  }

  .crew-map-section[data-mode="3d"] {
    padding-left: 0;
    width: min(70vh, 90vw);
    max-width: min(70vh, 90vw);
    height: 70vh;
    margin-left: calc(-50vw + 50%);
  }

  .crew-map-shape {
    width: 100%;
    max-width: 100vw;
    height: 100%;
    overflow: hidden;
    clip-path: url(#crewBlobClip);
    -webkit-clip-path: url(#crewBlobClip);
    transition: clip-path 0.4s ease, -webkit-clip-path 0.4s ease;
  }

  .crew-map-section[data-mode="3d"] .crew-map-shape {
    clip-path: circle(50%);
    -webkit-clip-path: circle(50%);
  }

  .crew-map-shape iframe {
    display: block;
    width: 100%;
    max-width: 100vw;
    height: 100%;
    border: none;
    vertical-align: top;
  }

  .sqs-block, .sqs-row, .sqs-column, .content-wrapper, .page-section, .user-items-list-section {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
  }

  @media (max-width: 768px) {
    .crew-map-section {
      width: 100vw;
      max-width: 100vw;
      height: 70vh;
      min-height: 480px;
      margin-top: -30px;
      margin-left: calc(-50vw + 50%);
      overflow: hidden;
    }

    .crew-map-section[data-mode="3d"] {
      padding-left: 0;
      width: 85vw;
      max-width: 85vw;
      height: 85vw;
      min-height: 320px;
      margin-top: 0;
    }

    .crew-map-shape {
      width: 100%;
      max-width: 100vw;
      height: 100%;
      clip-path: url(#crewBlobClipMobile);
      -webkit-clip-path: url(#crewBlobClipMobile);
    }

    .crew-map-section[data-mode="3d"] .crew-map-shape {
      clip-path: circle(50%);
      -webkit-clip-path: circle(50%);
    }

    .crew-map-shape iframe {
      width: 100%;
      max-width: 100vw;
      height: 100%;
    }
  }
</style>

<div class="crew-map-section" id="crew-map-section">

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="crewBlobClip" clipPathUnits="objectBoundingBox">
        <path d="
          M 0,0.32
          C 0.02,0.15 0.07,0.07 0.14,0.07
          C 0.19,0.07 0.20,0.14 0.26,0.13
          C 0.31,0.12 0.30,0.04 0.37,0.02
          C 0.45,0.00 0.58,0.02 0.68,0.03
          C 0.80,0.04 0.88,0.06 0.92,0.13
          C 0.97,0.20 1.00,0.32 1.00,0.44
          C 1.00,0.56 0.99,0.65 0.99,0.74
          C 0.99,0.84 0.93,0.90 0.85,0.92
          C 0.78,0.94 0.71,0.88 0.63,0.88
          C 0.56,0.88 0.53,0.95 0.45,0.95
          C 0.39,0.95 0.35,0.91 0.29,0.91
          C 0.21,0.91 0.13,0.94 0.07,0.91
          C 0.02,0.89 0.01,0.83 0.01,0.76
          C 0.00,0.61 0.00,0.46 0,0.32
          Z
        "/>
      </clipPath>

      <clipPath id="crewBlobClipMobile" clipPathUnits="objectBoundingBox">
        <path d="
          M 0,0.07
          C 0.10,0.015 0.22,0.00 0.33,0.02
          C 0.42,0.035 0.48,0.06 0.58,0.05
          C 0.68,0.04 0.72,0.005 0.82,0.01
          C 0.90,0.015 0.96,0.03 1,0.06
          L 1,0.93
          C 0.92,0.965 0.80,0.985 0.68,0.97
          C 0.58,0.958 0.50,0.99 0.40,0.98
          C 0.30,0.97 0.22,0.94 0.12,0.955
          C 0.06,0.965 0.02,0.95 0,0.92
          Z
        "/>
      </clipPath>
    </defs>
  </svg>

  <div class="crew-map-shape">
    <iframe 
      src="https://guardioesdaterra.github.io/EG-Maps/test/active-crews?hideAll=true&zoom=0.1"
    ></iframe>
  </div>

</div>

<script>
(function () {
  var MAP_ORIGIN = "https://guardioesdaterra.github.io";
  var section = document.getElementById("crew-map-section");

  window.addEventListener("message", function (event) {
    if (event.origin !== MAP_ORIGIN) return;
    if (event.data && event.data.type === "crew-resize") {
      var payload = event.data.payload || {};
      if (section) {
        section.setAttribute("data-mode", "3d");
        if (payload.width) section.style.width = payload.width;
        if (payload.height) section.style.height = payload.height;
      }
    }
    // Reset to 2D mode when view switches back
    if (event.data && event.data.type === "crew-view-changed") {
      var view = event.data.payload && event.data.payload.view;
      if (section) {
        if (view === "2d") {
          section.removeAttribute("data-mode");
          section.style.width = "";
          section.style.height = "";
        } else if (view === "3d") {
          section.setAttribute("data-mode", "3d");
        }
      }
    }
  });
})();
</script>
